[project]
name = "transitlog"
dynamic = ["version"]
description = "Download and summarise your own transit-card trip and purchase history (Clipper first)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amol Venkataraman" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
keywords = ["clipper", "clippercard", "transit", "bart", "muni", "trip-history", "cli", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/upstream-wontfix/transitlog"
Issues = "https://github.com/upstream-wontfix/transitlog/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transitlog = "transitlog.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/transitlog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/transitlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
