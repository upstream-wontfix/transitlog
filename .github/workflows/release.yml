name: Release

# Push a tag like v1.2.3 (matching the package version) to publish to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC); no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel="$(basename dist/*.whl)"
          version="$(echo "$wheel" | cut -d- -f2)"
          echo "tag=$tag package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/transitlog/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
